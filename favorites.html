<!DOCTYPE html>
<html lang="en" data-theme="saver">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student Laptop Finder - browse, save and compare laptops.">
  <title>My Favorites | Student Finder</title>
  <link href="./dist/output.css" rel="stylesheet">
  <script type="module" src="./src/js/favorites.js"></script>
</head>
<body>
<header class="theme-card border-b shadow-sm">
  <nav class="page-container flex flex-wrap items-center justify-between gap-4 py-4">
    <a href="./index.html" class="text-xl font-extrabold">💻 Student<span class="text-orange-500">Finder</span></a>
    <button id="menuToggle" class="btn-secondary md:hidden" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <div id="mainMenu" class="hidden w-full flex-col gap-4 md:flex md:w-auto md:flex-row md:items-center">
      <a href="./index.html">Home</a><a href="./laptops.html">Laptops</a><a href="./favorites.html">Favorites</a><a href="./compare.html">Compare</a>
      <button id="themeToggle" class="btn-action">Battery Saver</button>
    </div>
  </nav>
</header>

<main class="page-container">
  <div class="flex flex-wrap items-center justify-between gap-4"><h1 class="section-title">My favorite laptops ♥</h1><button id="clearFavorites" class="btn-secondary">Clear all</button></div>
  <section class="mb-8 grid gap-5 sm:grid-cols-3">
    <div class="theme-card rounded-2xl border p-5"><p class="text-muted">Total favorites</p><p id="totalFavorites" class="mt-2 text-3xl font-bold">0</p></div>
    <div class="theme-card rounded-2xl border p-5"><p class="text-muted">Total price</p><p id="totalPrice" class="mt-2 text-2xl font-bold">0 EGP</p></div>
    <div class="theme-card rounded-2xl border p-5"><p class="text-muted">Average price</p><p id="averagePrice" class="mt-2 text-2xl font-bold">0 EGP</p></div>
  </section>
  <div class="mb-6"><a href="./compare.html" class="btn-action">Compare selected favorites →</a></div>
  <div id="favoritesGrid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
</main>
<footer class="theme-card mt-16 border-t"><div class="page-container text-center text-sm"><p class="font-semibold">Student Laptop Finder</p></div></footer></body></html>
